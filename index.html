<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Fold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <div>
        <p class="brand">Fold</p>
        <h1 id="greet">Your money</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="exportBtn" type="button" title="Backup">↓</button>
        <button class="icon-btn" id="monthBtn" type="button"><span id="monthLabel">Sep</span></button>
      </div>
    </header>
    <select id="monthPick" class="sr-only" aria-label="Month"></select>
    <section id="view-home" class="view on">
      <article class="balance-card">
        <p>Available this month</p>
        <h2 id="leftThisMonth">$0.00</h2>
        <div class="flow">
          <span class="pill in" id="incAmt">+$0</span>
          <span class="pill out" id="expAmt">−$0</span>
        </div>
        <div class="split"><i id="incBar"></i></div>
        <small id="flowLabel">Add a paycheck to start</small>
      </article>
      <div class="section-row"><h3>Accounts</h3><button class="text-btn" data-go="accounts" type="button">Manage</button></div>
      <div id="acctStrip" class="strip"></div>
      <div class="section-row"><h3>Spending</h3></div>
      <ul id="catBreakdown" class="stack"></ul>
      <div class="section-row"><h3>Recent</h3><button class="text-btn" data-go="tx" type="button">See all</button></div>
      <ul id="recentList" class="stack"></ul>
    </section>
    <section id="view-tx" class="view">
      <div class="filter-row">
        <button class="chip on" data-filter="all" type="button">All</button>
        <button class="chip" data-filter="expense" type="button">Out</button>
        <button class="chip" data-filter="income" type="button">In</button>
      </div>
      <ul id="txList" class="stack"></ul>
    </section>
    <section id="view-accounts" class="view">
      <form id="acctForm" class="sheet-form">
        <h3>New account</h3>
        <input name="name" required maxlength="40" placeholder="Account name" />
        <div class="two">
          <select name="type">
            <option value="checking">Checking</option>
            <option value="savings">Savings</option>
            <option value="credit">Credit card</option>
            <option value="cash">Cash</option>
            <option value="other">Other</option>
          </select>
          <input name="balance" type="number" inputmode="decimal" step="0.01" placeholder="Balance" value="0" />
        </div>
        <button class="primary" type="submit">Add account</button>
      </form>
      <p class="hint">Credit cards count as money you owe.</p>
      <ul id="acctList" class="stack"></ul>
    </section>
    <section id="view-budgets" class="view">
      <form id="budgetForm" class="sheet-form">
        <h3>Monthly limit</h3>
        <div class="two">
          <select name="category"></select>
          <input name="limit" type="number" inputmode="decimal" step="0.01" min="0" required placeholder="400" />
        </div>
        <button class="primary" type="submit">Save limit</button>
      </form>
      <ul id="budgetList" class="stack"></ul>
    </section>
    <button class="fab" id="fab" type="button">+</button>
    <nav class="dock">
      <button class="dock-btn on" data-view="home" type="button">Home</button>
      <button class="dock-btn" data-view="tx" type="button">Activity</button>
      <button class="dock-btn" data-view="accounts" type="button">Wallets</button>
      <button class="dock-btn" data-view="budgets" type="button">Plans</button>
    </nav>
  </div>
  <div class="overlay" id="overlay" hidden>
    <form id="txForm" class="modal">
      <div class="grab"></div>
      <h2>New entry</h2>
      <div class="seg">
        <label class="on"><input type="radio" name="kind" value="expense" checked /> Spend</label>
        <label><input type="radio" name="kind" value="income" /> Income</label>
        <label><input type="radio" name="kind" value="transfer" /> Move</label>
      </div>
      <input class="money-input" name="amount" type="number" inputmode="decimal" step="0.01" min="0" required placeholder="0.00" />
      <select name="accountId" required></select>
      <select name="toAccountId" class="transfer-only hidden"></select>
      <select name="category" class="not-transfer"></select>
      <input name="note" maxlength="80" placeholder="What's this for?" />
      <input name="date" type="date" required />
      <div class="modal-actions">
        <button class="ghost" id="closeModal" type="button">Cancel</button>
        <button class="primary" type="submit">Save</button>
      </div>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
